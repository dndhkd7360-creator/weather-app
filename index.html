<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생들의 손그림 날씨 앱 (v1 & v2 히스토리)</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Font (Jua for playful handwriting feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Nanum Gothic', sans-serif;
            background-color: #cbd5e1;
            user-select: none;
        }
        
        .handdrawn-border {
            border-style: solid;
            border-width: 3px;
            border-color: #1e293b;
            border-radius: 20px;
        }

        .sketch-box-blue {
            background-color: #f0fdf4;
            border: 3px solid #60a5fa;
            box-shadow: 4px 4px 0px #93c5fd;
        }

        .sketch-box-green {
            background-color: #f0fdf4;
            border: 3px solid #4ade80;
            box-shadow: 4px 4px 0px #86efac;
        }

        .sketch-box-yellow {
            background-color: #fffde7;
            border: 3px solid #facc15;
            box-shadow: 4px 4px 0px #fde047;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 3px solid #3b82f6;
            border-radius: 24px;
            padding: 12px 20px;
            box-shadow: 3px 3px 0px #93c5fd;
        }

        .speech-bubble:after {
            content: '';
            position: absolute;
            left: -15px;
            top: 40%;
            border-width: 8px 15px 8px 0;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
            display: block;
            width: 0;
        }

        .speech-bubble:before {
            content: '';
            position: absolute;
            left: -19px;
            top: 40%;
            border-width: 8px 15px 8px 0;
            border-style: solid;
            border-color: transparent #3b82f6 transparent transparent;
            display: block;
            width: 0;
        }

        .calendar-card {
            background: #ffffff;
            border: 3px solid #000;
            border-radius: 20px;
            box-shadow: 4px 4px 0px #fdba74;
        }

        .calendar-ring {
            width: 12px;
            height: 18px;
            background: #475569;
            border-radius: 6px;
            border: 2px solid #000;
        }

        /* Animations */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .bounce-element {
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }

        @keyframes shiver {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-2px, 1px) rotate(-1deg); }
            50% { transform: translate(1px, -1px) rotate(1deg); }
            75% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
        .shiver-anim {
            animation: shiver 0.3s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 bg-slate-200">

    <!-- VERSION SELECTOR TOP BAR -->
    <div class="w-full max-w-md bg-white border-4 border-slate-800 rounded-2xl p-2.5 mb-4 shadow-lg flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="bg-amber-400 border-2 border-slate-800 px-2.5 py-0.5 rounded-lg text-xs font-black text-slate-900">버전 선택</span>
            <span id="version-label" class="text-xs text-slate-600 font-bold">버전을 선택해서 변경 내역을 확인하세요</span>
        </div>
        <div class="flex bg-slate-100 p-1 rounded-xl border-2 border-slate-800">
            <button id="btn-v1" onclick="switchVersion('v1')" class="px-3 py-1 text-sm font-bold rounded-lg transition-all bg-sky-500 text-white shadow-sm border border-slate-800">
                v1.0 (원본)
            </button>
            <button id="btn-v2" onclick="switchVersion('v2')" class="px-3 py-1 text-sm font-bold rounded-lg transition-all text-slate-700 hover:bg-slate-200">
                v2.0 (업데이트)
            </button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER (Mobile Frame look) -->
    <div class="w-full max-w-md bg-sky-200 rounded-[35px] border-4 border-slate-800 p-4 sm:p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[780px]">
        
        <!-- Background Sky Decorative Clouds -->
        <div class="absolute top-4 left-6 text-white/70">
            <svg width="40" height="25" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </div>
        <div class="absolute top-10 right-8 text-white/70">
            <svg width="55" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </div>

        <div>
            <!-- HEADER CONTROLS (Location selector & temperature simulator) -->
            <div class="flex justify-between items-center mb-4 z-10 relative bg-white/90 p-2.5 rounded-2xl border-2 border-slate-800">
                <div class="flex items-center gap-1.5 text-slate-800 font-bold text-lg flex-1 mr-2">
                    <i data-lucide="map-pin" class="text-red-500 w-5 h-5 flex-shrink-0"></i>
                    <select id="city-select" onchange="updateWeatherByCity()" class="bg-transparent text-slate-800 focus:outline-none cursor-pointer font-bold text-base sm:text-lg w-full">
                        <option value="Seoul">서울특별시</option>
                        <option value="Busan">부산광역시</option>
                        <option value="Daegu">대구광역시</option>
                        <option value="Incheon">인천광역시</option>
                        <option value="Gwangju">광주광역시</option>
                        <option value="Daejeon">대전광역시</option>
                        <option value="Ulsan">울산광역시</option>
                        <option value="Jeju">제주특별자치도</option>
                    </select>
                </div>
                <!-- Live Fetch Button -->
                <button onclick="fetchRealtimeWeather()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 border-2 border-slate-800 font-extrabold text-xs px-2.5 py-1.5 rounded-xl shadow-sm flex items-center gap-1 transition-all active:scale-95 flex-shrink-0">
                    <i data-lucide="refresh-cw" id="refresh-icon" class="w-3.5 h-3.5"></i>
                    <span>실시간 갱신</span>
                </button>
            </div>

            <!-- TOP SECTION: CALENDAR TEMP & CHARACTER SPEECH -->
            <div class="grid grid-cols-12 gap-2 items-center my-2 relative z-10">
                
                <!-- Left: Calendar Card with Temperature -->
                <div class="col-span-6 relative">
                    <div class="absolute -top-3 left-0 right-0 flex justify-around px-4 z-20">
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                    </div>

                    <div class="calendar-card pt-4 pb-3 px-3 text-center border-3 border-slate-800">
                        <div class="bg-pink-100 rounded-xl py-1 px-2 border-2 border-pink-300 mb-2">
                            <span id="current-date" class="text-pink-600 font-bold text-base sm:text-lg tracking-wider">2026년 10월 21일</span>
                        </div>
                        <div class="flex items-center justify-center gap-0.5">
                            <span id="temp-display" class="text-5xl font-extrabold text-slate-800 tracking-tight">25</span>
                            <span class="text-2xl font-bold text-slate-700 self-start mt-1">°C</span>
                        </div>
                    </div>
                </div>

                <!-- Right: Shivering Character & Speech Bubble -->
                <div class="col-span-6 flex flex-col items-center justify-center relative pl-2">
                    <div class="speech-bubble mb-2 w-full text-center">
                        <p id="weather-comment" class="text-slate-800 font-bold text-lg leading-snug">
                            어제보다 추워요.
                        </p>
                    </div>

                    <div id="character-svg" class="w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center transition-transform">
                        <!-- Dynamic SVG character rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- v2 NEW FEATURE: EXTRA WEATHER STATS (Visible only in v2) -->
            <div id="v2-stats-panel" class="hidden my-3 grid grid-cols-3 gap-2 relative z-10">
                <div class="sketch-box-yellow p-2 rounded-xl text-center">
                    <div class="text-xs text-slate-600 font-bold">습도</div>
                    <div id="humidity-val" class="text-base font-extrabold text-slate-800">55%</div>
                </div>
                <div class="sketch-box-yellow p-2 rounded-xl text-center">
                    <div class="text-xs text-slate-600 font-bold">풍속</div>
                    <div id="wind-val" class="text-base font-extrabold text-slate-800">2.5m/s</div>
                </div>
                <div class="sketch-box-yellow p-2 rounded-xl text-center">
                    <div class="text-xs text-slate-600 font-bold">체감온도</div>
                    <div id="feels-val" class="text-base font-extrabold text-slate-800">24°C</div>
                </div>
            </div>

            <!-- MIDDLE SECTION: HOURLY WEATHER GRAPH -->
            <div class="mt-3 mb-3 sketch-box-blue p-3.5 rounded-2xl relative z-10">
                <div class="flex items-center justify-between mb-2">
                    <div class="inline-block bg-amber-300 border-2 border-slate-800 px-4 py-1 rounded-full text-slate-900 font-extrabold text-base transform -rotate-1 shadow-sm">
                        시간별 날씨
                    </div>
                    <span id="v2-badge-hourly" class="hidden bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-800">v2 향상됨</span>
                </div>

                <div class="relative w-full h-32 mt-1">
                    <svg id="hourly-svg" class="w-full h-full overflow-visible" viewBox="0 0 300 110">
                        <!-- Rendered via JavaScript -->
                    </svg>
                </div>

                <div class="grid grid-cols-4 gap-1 text-center mt-1">
                    <div><span class="bg-blue-500 text-white text-xs px-2.5 py-1 rounded-full border border-blue-700 font-bold shadow-sm">9시</span></div>
                    <div><span class="bg-blue-500 text-white text-xs px-2.5 py-1 rounded-full border border-blue-700 font-bold shadow-sm">12시</span></div>
                    <div><span class="bg-blue-500 text-white text-xs px-2.5 py-1 rounded-full border border-blue-700 font-bold shadow-sm">3시</span></div>
                    <div><span class="bg-blue-500 text-white text-xs px-2.5 py-1 rounded-full border border-blue-700 font-bold shadow-sm">6시</span></div>
                </div>
            </div>

            <!-- v2 NEW FEATURE: WEEKLY FORECAST (Visible only in v2) -->
            <div id="v2-weekly-panel" class="hidden mb-3 bg-white border-3 border-slate-800 p-3 rounded-2xl relative z-10 shadow-sm">
                <div class="text-slate-800 font-extrabold text-sm mb-2 flex items-center justify-between">
                    <span>📅 이번 주 날씨 예보 (v2 신규)</span>
                </div>
                <div class="grid grid-cols-5 gap-1.5 text-center text-xs" id="weekly-forecast-container">
                    <!-- Dynamic weekly weather forecast rendered via JS -->
                </div>
            </div>

            <!-- BOTTOM SECTION: OUTFIT & ACTIVITY RECOMMENDATION CARDS -->
            <div class="grid grid-cols-2 gap-3 mt-2 relative z-10">
                <div class="sketch-box-green p-3 flex items-center gap-2 rounded-2xl border-3">
                    <div id="clothes-icon" class="w-12 h-12 flex-shrink-0 flex items-center justify-center">
                        <!-- Dynamic Clothing SVG -->
                    </div>
                    <div class="flex-1">
                        <p id="clothes-text" class="text-slate-800 font-extrabold text-sm sm:text-base leading-tight">
                            도톰한 옷이 좋아요.
                        </p>
                    </div>
                </div>

                <div class="sketch-box-green p-3 flex items-center gap-2 rounded-2xl border-3">
                    <div id="activity-icon" class="w-12 h-12 flex-shrink-0 flex items-center justify-center">
                        <!-- Dynamic Activity SVG -->
                    </div>
                    <div class="flex-1">
                        <p id="activity-text" class="text-slate-800 font-extrabold text-sm sm:text-base leading-tight">
                            가볍게 달리기 좋아요.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM DECORATIVE GRASS -->
        <div class="w-full mt-4 flex justify-between items-end relative z-0">
            <svg class="w-full h-8 text-green-400" viewBox="0 0 100 20" preserveAspectRatio="none">
                <path d="M0 20 Q 5 5 10 20 Q 15 8 20 20 Q 25 3 30 20 Q 35 7 40 20 Q 45 4 50 20 Q 55 8 60 20 Q 65 2 70 20 Q 75 6 80 20 Q 85 4 90 20 Q 95 9 100 20 Z" fill="currentColor" stroke="#1e293b" stroke-width="1"/>
            </svg>
        </div>
    </div>

    <!-- VERSION RELEASE NOTES CARD -->
    <div class="w-full max-w-md bg-white border-3 border-slate-800 rounded-2xl p-4 mt-4 shadow-md">
        <h3 id="changelog-title" class="font-extrabold text-base text-slate-800 mb-1 flex items-center gap-2">
            <i data-lucide="history" class="w-4 h-4 text-sky-600"></i>
            <span>v1.0 버전에 대하여</span>
        </h3>
        <p id="changelog-desc" class="text-xs text-slate-600 leading-relaxed font-semibold">
            학생들의 손그림 일러스트 디자인 원본 버전입니다. 기본 시간별 날씨 및 온도 추천 캐릭터 기능이 포함되어 있습니다.
        </p>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // App State
        const state = {
            version: 'v1', // 'v1' or 'v2'
            city: 'Seoul',
            temp: 25,
            humidity: 55,
            windSpeed: 2.5,
            feelsLike: 24,
            hourlyTemps: [22, 25, 27, 24],
            hourlyIcons: ['sun-cloud', 'sun', 'sun', 'sun-cloud'],
            weeklyData: [
                { day: '월', tempMin: 18, tempMax: 26, icon: 'sun' },
                { day: '화', tempMin: 19, tempMax: 27, icon: 'sun' },
                { day: '수', tempMin: 17, tempMax: 24, icon: 'rain' },
                { day: '목', tempMin: 16, tempMax: 22, icon: 'cloud' },
                { day: '금', tempMin: 18, tempMax: 25, icon: 'sun' }
            ]
        };

        lucide.createIcons();

        // Switch App Version (v1 <-> v2)
        function switchVersion(ver) {
            state.version = ver;
            const btnV1 = document.getElementById('btn-v1');
            const btnV2 = document.getElementById('btn-v2');
            const statsPanel = document.getElementById('v2-stats-panel');
            const weeklyPanel = document.getElementById('v2-weekly-panel');
            const badgeHourly = document.getElementById('v2-badge-hourly');
            const changelogTitle = document.getElementById('changelog-title');
            const changelogDesc = document.getElementById('changelog-desc');

            if (ver === 'v1') {
                btnV1.className = "px-3 py-1 text-sm font-bold rounded-lg transition-all bg-sky-500 text-white shadow-sm border border-slate-800";
                btnV2.className = "px-3 py-1 text-sm font-bold rounded-lg transition-all text-slate-700 hover:bg-slate-200";
                statsPanel.classList.add('hidden');
                weeklyPanel.classList.add('hidden');
                badgeHourly.classList.add('hidden');

                changelogTitle.innerHTML = `<i data-lucide="history" class="w-4 h-4 text-sky-600"></i><span>v1.0 버전에 대하여</span>`;
                changelogDesc.innerText = "학생들의 손그림 일러스트 디자인 원본 버전입니다. 기본 시간별 날씨 및 온도 추천 캐릭터 기능이 포함되어 있습니다.";
            } else {
                btnV2.className = "px-3 py-1 text-sm font-bold rounded-lg transition-all bg-emerald-500 text-white shadow-sm border border-slate-800";
                btnV1.className = "px-3 py-1 text-sm font-bold rounded-lg transition-all text-slate-700 hover:bg-slate-200";
                statsPanel.classList.remove('hidden');
                weeklyPanel.classList.remove('hidden');
                badgeHourly.classList.remove('hidden');

                changelogTitle.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4 text-emerald-600"></i><span>v2.0 업데이트 변경 내역</span>`;
                changelogDesc.innerText = "✨ v2.0 변경점: 체감온도/습도/풍속 상세 정보 패널 추가, 5일간의 주간 날씨 예보 기능 추가, 데이터 정밀도 향상.";
            }
            lucide.createIcons();
            updateUI();
        }

        function setTodayDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            document.getElementById('current-date').innerText = `${year}년 ${month}월 ${date}일`;
        }

        // Fetch Realtime Weather Data
        async function fetchRealtimeWeather() {
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            const cityCoordinates = {
                'Seoul': { lat: 37.5665, lon: 126.9780 },
                'Busan': { lat: 35.1796, lon: 129.0756 },
                'Daegu': { lat: 35.8714, lon: 128.6014 },
                'Incheon': { lat: 37.4563, lon: 126.7052 },
                'Gwangju': { lat: 35.1595, lon: 126.8526 },
                'Daejeon': { lat: 36.3510, lon: 127.3850 },
                'Ulsan': { lat: 35.5383, lon: 129.3114 },
                'Jeju': { lat: 33.4996, lon: 126.5312 }
            };

            const coords = cityCoordinates[state.city] || cityCoordinates['Seoul'];

            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,apparent_temperature,windspeed_10m&timezone=Asia%2FTokyo`);
                const data = await response.json();

                if (data && data.current_weather) {
                    state.temp = Math.round(data.current_weather.temperature);
                    state.windSpeed = data.current_weather.windspeed || 2.5;
                    
                    if (data.hourly) {
                        const currentHour = new Date().getHours();
                        state.humidity = data.hourly.relativehumidity_2m ? data.hourly.relativehumidity_2m[currentHour] : 55;
                        state.feelsLike = data.hourly.apparent_temperature ? Math.round(data.hourly.apparent_temperature[currentHour]) : state.temp - 1;

                        if (data.hourly.temperature_2m) {
                            state.hourlyTemps = [
                                Math.round(data.hourly.temperature_2m[currentHour] || state.temp),
                                Math.round(data.hourly.temperature_2m[(currentHour + 3) % 24] || state.temp + 1),
                                Math.round(data.hourly.temperature_2m[(currentHour + 6) % 24] || state.temp + 2),
                                Math.round(data.hourly.temperature_2m[(currentHour + 9) % 24] || state.temp - 1)
                            ];
                        }
                    }
                    updateUI();
                }
            } catch (error) {
                console.error("실시간 날씨 정보 연동 오류", error);
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        // Render Character SVG
        function renderCharacter(temp) {
            const container = document.getElementById('character-svg');
            
            if (temp < 18) {
                container.innerHTML = `
                <svg class="w-full h-full shiver-anim" viewBox="0 0 100 100">
                    <path d="M 30 40 Q 20 60 25 80 Q 50 85 75 80 Q 80 60 70 40 Z" fill="#7c2d12" stroke
