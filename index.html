<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생들의 손그림 날씨 앱 (동글체)</title>
    <!-- PWA Web App Manifest & Theme Color -->
    <meta name="theme-color" content="#bae6fd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="손그림날씨">
    
    <!-- Dynamic Web Manifest Link generated via Data URI -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Font (Dongle Font for round cute comic feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Dongle', sans-serif;
            font-weight: 400;
            background-color: #cbd5e1;
            user-select: none;
        }
        
        .handdrawn-border {
            border-style: solid;
            border-width: 3px;
            border-color: #1e293b;
            border-radius: 20px;
        }

        .sketch-box-blue {
            background-color: #f0fdf4;
            border: 3px solid #60a5fa;
            box-shadow: 4px 4px 0px #93c5fd;
        }

        .sketch-box-green {
            background-color: #f0fdf4;
            border: 3px solid #4ade80;
            box-shadow: 4px 4px 0px #86efac;
        }

        .sketch-box-yellow {
            background-color: #fffde7;
            border: 3px solid #facc15;
            box-shadow: 4px 4px 0px #fde047;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 3px solid #3b82f6;
            border-radius: 24px;
            padding: 8px 16px;
            box-shadow: 3px 3px 0px #93c5fd;
        }

        .speech-bubble:after {
            content: '';
            position: absolute;
            left: -15px;
            top: 40%;
            border-width: 8px 15px 8px 0;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
            display: block;
            width: 0;
        }

        .speech-bubble:before {
            content: '';
            position: absolute;
            left: -19px;
            top: 40%;
            border-width: 8px 15px 8px 0;
            border-style: solid;
            border-color: transparent #3b82f6 transparent transparent;
            display: block;
            width: 0;
        }

        .calendar-card {
            background: #ffffff;
            border: 3px solid #000;
            border-radius: 20px;
            box-shadow: 4px 4px 0px #fdba74;
        }

        .calendar-ring {
            width: 12px;
            height: 18px;
            background: #475569;
            border-radius: 6px;
            border: 2px solid #000;
        }

        /* Animations */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .bounce-element {
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }

        @keyframes shiver {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-2px, 1px) rotate(-1deg); }
            50% { transform: translate(1px, -1px) rotate(1deg); }
            75% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
        .shiver-anim {
            animation: shiver 0.3s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 bg-slate-200">

    <!-- MAIN APP CONTAINER (Mobile Frame look) -->
    <div class="w-full max-w-md bg-sky-200 rounded-[35px] border-4 border-slate-800 p-4 sm:p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[780px]">
        
        <!-- Background Sky Decorative Clouds -->
        <div class="absolute top-4 left-6 text-white/70">
            <svg width="40" height="25" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </div>
        <div class="absolute top-10 right-8 text-white/70">
            <svg width="55" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </div>

        <div>
            <!-- APP HEADER LOGO BAR & LOCATION CONTROLS -->
            <div class="flex flex-col gap-2 mb-2 z-10 relative">
                <!-- App Logo Banner (Hand-drawn Style) -->
                <div class="flex items-center justify-between bg-white/90 px-3 py-1.5 rounded-2xl border-2 border-slate-800 shadow-sm">
                    <div class="flex items-center gap-2">
                        <!-- App Icon (Sun & Cloud Hand-drawn SVG Logo) -->
                        <div class="w-9 h-9 rounded-xl bg-amber-200 border-2 border-slate-800 flex items-center justify-center shadow-xs">
                            <svg width="28" height="28" viewBox="0 0 100 100">
                                <circle cx="38" cy="38" r="20" fill="#facc15" stroke="#1e293b" stroke-width="4"/>
                                <path d="M 38 10 L 38 4 M 38 66 L 38 72 M 10 38 L 4 38 M 66 38 L 72 38" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
                                <path d="M 50 65 Q 40 45 60 45 Q 70 35 82 45 Q 92 50 88 65 Q 85 75 70 75 Q 55 75 50 65 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-slate-900 font-bold text-2xl leading-none pt-1">손그림 날씨</h1>
                            <span class="text-lg text-slate-500 font-bold -mt-2 block leading-none">우리들의 상큼한 일기예보</span>
                        </div>
                    </div>
                    <!-- PWA Install Button (Shown if installable) -->
                    <button id="pwa-install-btn" onclick="installPWA()" class="hidden bg-emerald-400 hover:bg-emerald-500 text-slate-900 border-2 border-slate-800 font-bold text-lg px-2.5 py-0.5 rounded-xl shadow-xs transition-all active:scale-95 flex items-center gap-1">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span>앱 설치</span>
                    </button>
                </div>

                <!-- Location selector & GPS/Refresh controls -->
                <div class="flex justify-between items-center bg-white/90 px-2.5 py-1 rounded-2xl border-2 border-slate-800">
                    <div class="flex items-center gap-1 text-slate-800 font-bold text-2xl flex-1 mr-1">
                        <i data-lucide="map-pin" class="text-red-500 w-5 h-5 flex-shrink-0"></i>
                        <select id="city-select" onchange="updateWeatherByCity()" class="bg-transparent text-slate-800 focus:outline-none cursor-pointer font-bold text-2xl w-full">
                            <option value="GPS">내 현재 위치 (GPS)</option>
                            <option value="Seoul" selected>서울특별시</option>
                            <option value="Busan">부산광역시</option>
                            <option value="Daegu">대구광역시</option>
                            <option value="Incheon">인천광역시</option>
                            <option value="Gwangju">광주광역시</option>
                            <option value="Daejeon">대전광역시</option>
                            <option value="Ulsan">울산광역시</option>
                            <option value="Jeju">제주특별자치도</option>
                        </select>
                    </div>
                    <!-- GPS Auto-locate Button -->
                    <button onclick="requestGPSLocation()" title="GPS 현재 위치 감지" class="bg-sky-400 hover:bg-sky-500 text-slate-900 border-2 border-slate-800 font-bold p-1 rounded-xl shadow-xs transition-all active:scale-95 mr-1 flex-shrink-0">
                        <i data-lucide="crosshair" id="gps-icon" class="w-4 h-4"></i>
                    </button>
                    <!-- Live Fetch Button -->
                    <button onclick="fetchRealtimeWeather()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 border-2 border-slate-800 font-bold text-lg px-2 py-0.5 rounded-xl shadow-xs flex items-center gap-1 transition-all active:scale-95 flex-shrink-0">
                        <i data-lucide="refresh-cw" id="refresh-icon" class="w-3.5 h-3.5"></i>
                        <span>갱신</span>
                    </button>
                </div>
            </div>

            <!-- TOP SECTION: CALENDAR TEMP & CHARACTER SPEECH -->
            <div class="grid grid-cols-12 gap-2 items-center my-2 relative z-10">
                
                <!-- Left: Calendar Card with Temperature -->
                <div class="col-span-6 relative">
                    <div class="absolute -top-3 left-0 right-0 flex justify-around px-4 z-20">
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                    </div>

                    <div class="calendar-card pt-4 pb-1 px-3 text-center border-3 border-slate-800">
                        <div class="bg-pink-100 rounded-xl py-0.5 px-1.5 border-2 border-pink-300 mb-1 overflow-hidden">
                            <span id="current-date" class="text-pink-600 font-bold text-xl tracking-tight whitespace-nowrap block">2026년 10월 21일</span>
                        </div>
                        <div class="flex items-center justify-center gap-0.5">
                            <span id="temp-display" class="text-6xl font-bold text-slate-800 tracking-tight leading-none">25</span>
                            <span class="text-3xl font-bold text-slate-700 self-start mt-1">°C</span>
                        </div>
                    </div>
                </div>

                <!-- Right: Shivering Character & Speech Bubble -->
                <div class="col-span-6 flex flex-col items-center justify-center relative pl-2">
                    <div class="speech-bubble mb-1 w-full text-center">
                        <p id="weather-comment" class="text-slate-800 font-bold text-2xl leading-none pt-1">
                            어제보다 추워요.
                        </p>
                    </div>

                    <div id="character-svg" class="w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center transition-transform">
                        <!-- Dynamic SVG character rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- EXTRA WEATHER STATS PANEL -->
            <div id="v2-stats-panel" class="my-2 grid grid-cols-3 gap-2 relative z-10">
                <div class="sketch-box-yellow px-2 py-1 rounded-xl text-center">
                    <div class="text-lg text-slate-600 font-bold leading-none">습도</div>
                    <div id="humidity-val" class="text-2xl font-bold text-slate-800 leading-none">55%</div>
                </div>
                <div class="sketch-box-yellow px-2 py-1 rounded-xl text-center">
                    <div class="text-lg text-slate-600 font-bold leading-none">풍속</div>
                    <div id="wind-val" class="text-2xl font-bold text-slate-800 leading-none">2.5m/s</div>
                </div>
                <div class="sketch-box-yellow px-2 py-1 rounded-xl text-center">
                    <div class="text-lg text-slate-600 font-bold leading-none">체감온도</div>
                    <div id="feels-val" class="text-2xl font-bold text-slate-800 leading-none">24°C</div>
                </div>
            </div>

            <!-- MIDDLE SECTION: HOURLY WEATHER GRAPH -->
            <div class="mt-2 mb-2 sketch-box-blue p-3 rounded-2xl relative z-10">
                <div class="flex items-center justify-between mb-1">
                    <div class="inline-block bg-amber-300 border-2 border-slate-800 px-3 py-0 rounded-full text-slate-900 font-bold text-xl transform -rotate-1 shadow-xs leading-tight">
                        시간별 날씨
                    </div>
                    <span id="location-badge" class="bg-emerald-500 text-white text-base font-bold px-2 py-0.5 rounded-full border border-slate-800 leading-none">서울</span>
                </div>

                <div class="relative w-full h-32 mt-1">
                    <svg id="hourly-svg" class="w-full h-full overflow-visible" viewBox="0 0 300 110">
                        <!-- Rendered via JavaScript -->
                    </svg>
                </div>

                <div class="grid grid-cols-4 gap-1 text-center mt-1">
                    <div><span class="bg-blue-500 text-white text-base px-2.5 py-0.5 rounded-full border border-blue-700 font-bold shadow-xs leading-none">9시</span></div>
                    <div><span class="bg-blue-500 text-white text-base px-2.5 py-0.5 rounded-full border border-blue-700 font-bold shadow-xs leading-none">12시</span></div>
                    <div><span class="bg-blue-500 text-white text-base px-2.5 py-0.5 rounded-full border border-blue-700 font-bold shadow-xs leading-none">3시</span></div>
                    <div><span class="bg-blue-500 text-white text-base px-2.5 py-0.5 rounded-full border border-blue-700 font-bold shadow-xs leading-none">6시</span></div>
                </div>
            </div>

            <!-- WEEKLY FORECAST PANEL -->
            <div id="v2-weekly-panel" class="mb-2 bg-white border-3 border-slate-800 p-2.5 rounded-2xl relative z-10 shadow-xs">
                <div class="text-slate-800 font-bold text-lg mb-1 flex items-center justify-between leading-none">
                    <span>📅 주간 날씨 예보</span>
                </div>
                <div class="grid grid-cols-5 gap-1 text-center" id="weekly-forecast-container">
                    <!-- Dynamic weekly weather forecast rendered via JS -->
                </div>
            </div>

            <!-- BOTTOM SECTION: OUTFIT & ACTIVITY RECOMMENDATION CARDS -->
            <div class="grid grid-cols-2 gap-2 mt-2 relative z-10">
                <div class="sketch-box-green p-2.5 flex items-center gap-2 rounded-2xl border-3">
                    <div id="clothes-icon" class="w-10 h-10 flex-shrink-0 flex items-center justify-center">
                        <!-- Dynamic Clothing SVG -->
                    </div>
                    <div class="flex-1">
                        <p id="clothes-text" class="text-slate-800 font-bold text-xl leading-tight keep-all break-keep">
                            도톰한 옷을 입으세요!
                        </p>
                    </div>
                </div>

                <div class="sketch-box-green p-2.5 flex items-center gap-2 rounded-2xl border-3">
                    <div id="activity-icon" class="w-10 h-10 flex-shrink-0 flex items-center justify-center">
                        <!-- Dynamic Activity SVG -->
                    </div>
                    <div class="flex-1">
                        <p id="activity-text" class="text-slate-800 font-bold text-xl leading-tight keep-all break-keep">
                            실내 활동을 추천해요.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM DECORATIVE GRASS -->
        <div class="w-full mt-3 flex justify-between items-end relative z-0">
            <svg class="w-full h-8 text-green-400" viewBox="0 0 100 20" preserveAspectRatio="none">
                <path d="M0 20 Q 5 5 10 20 Q 15 8 20 20 Q 25 3 30 20 Q 35 7 40 20 Q 45 4 50 20 Q 55 8 60 20 Q 65 2 70 20 Q 75 6 80 20 Q 85 4 90 20 Q 95 9 100 20 Z" fill="currentColor" stroke="#1e293b" stroke-width="1"/>
            </svg>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // App State
        const state = {
            city: 'Seoul',
            customLatLon: null, // For GPS coordinates
            temp: 25,
            humidity: 55,
            windSpeed: 2.5,
            feelsLike: 24,
            hourlyTemps: [22, 25, 27, 24],
            hourlyIcons: ['sun-cloud', 'sun', 'sun', 'sun-cloud'],
            weeklyData: [
                { day: '월', tempMin: 18, tempMax: 26, icon: 'sun' },
                { day: '화', tempMin: 19, tempMax: 27, icon: 'sun' },
                { day: '수', tempMin: 17, tempMax: 24, icon: 'rain' },
                { day: '목', tempMin: 16, tempMax: 22, icon: 'cloud' },
                { day: '금', tempMin: 18, tempMax: 25, icon: 'sun' }
            ]
        };

        let deferredPrompt = null;

        // PWA Setup & Manifest Generation
        function setupPWA() {
            const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#bae6fd"/><circle cx="50" cy="42" r="22" fill="#facc15" stroke="#1e293b" stroke-width="5"/><path d="M 50 10 L 50 4 M 50 74 L 50 80 M 18 42 L 12 42 M 82 42 L 88 42" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/><path d="M 35 65 Q 25 45 45 45 Q 55 35 67 45 Q 77 50 73 65 Q 70 75 55 75 Q 40 75 35 65 Z" fill="#ffffff" stroke="#1e293b" stroke-width="5"/></svg>`;
            const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);

            const manifest = {
                name: "학생 손그림 날씨 앱",
                short_name: "손그림날씨",
                description: "학생들의 아기자기한 손그림으로 확인하는 날씨 앱",
                start_url: "./",
                display: "standalone",
                background_color: "#bae6fd",
                theme_color: "#bae6fd",
                icons: [
                    {
                        src: iconUrl,
                        sizes: "512x512",
                        type: "image/svg+xml",
                        purpose: "any maskable"
                    }
                ]
            };

            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], { type: 'application/json' });
            const manifestUrl = URL.createObjectURL(blob);
            document.getElementById('manifest-placeholder').setAttribute('href', manifestUrl);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'sketch-weather-v1';
                    self.addEventListener('install', (e) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (e) => {
                        e.waitUntil(clients.claim());
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((response) => {
                                return response || fetch(e.request).catch(() => {
                                    return new Response('offline');
                                });
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration error:', err));
            }

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const installBtn = document.getElementById('pwa-install-btn');
                if (installBtn) installBtn.classList.remove('hidden');
            });
        }

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('pwa-install-btn').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        function requestGPSLocation(silent = false) {
            const gpsIcon = document.getElementById('gps-icon');
            if (gpsIcon) gpsIcon.classList.add('animate-spin');

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        state.customLatLon = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        };
                        
                        const citySelect = document.getElementById('city-select');
                        if (citySelect) citySelect.value = "GPS";
                        state.city = "GPS";

                        await fetchRealtimeWeather();
                        if (gpsIcon) gpsIcon.classList.remove('animate-spin');
                    },
                    (error) => {
                        if (gpsIcon) gpsIcon.classList.remove('animate-spin');
                        if (!silent) {
                            console.warn("GPS 수신 실패, 기본 위치(서울)를 사용합니다.", error);
                        }
                        state.city = "Seoul";
                        const citySelect = document.getElementById('city-select');
                        if (citySelect) citySelect.value = "Seoul";
                        fetchRealtimeWeather();
                    },
                    { timeout: 7000, enableHighAccuracy: true }
                );
            } else {
                if (gpsIcon) gpsIcon.classList.remove('animate-spin');
                if (!silent) console.warn("GPS를 지원하지 않는 브라우저입니다.");
                fetchRealtimeWeather();
            }
        }

        function updateWeatherByCity() {
            const select = document.getElementById('city-select');
            state.city = select.value;
            if (state.city === 'GPS') {
                requestGPSLocation();
            } else {
                state.customLatLon = null;
                fetchRealtimeWeather();
            }
        }

        function setTodayDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            document.getElementById('current-date').innerText = `${year}년 ${month}월 ${date}일`;
        }

        async function fetchRealtimeWeather() {
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            const cityCoordinates = {
                'Seoul': { lat: 37.5665, lon: 126.9780, name: '서울특별시' },
                'Busan': { lat: 35.1796, lon: 129.0756, name: '부산광역시' },
                'Daegu': { lat: 35.8714, lon: 128.6014, name: '대구광역시' },
                'Incheon': { lat: 37.4563, lon: 126.7052, name: '인천광역시' },
                'Gwangju': { lat: 35.1595, lon: 126.8526, name: '광주광역시' },
                'Daejeon': { lat: 36.3510, lon: 127.3850, name: '대전광역시' },
                'Ulsan': { lat: 35.5383, lon: 129.3114, name: '울산광역시' },
                'Jeju': { lat: 33.4996, lon: 126.5312, name: '제주특별자치도' }
            };

            let coords = cityCoordinates[state.city] || cityCoordinates['Seoul'];
            let locationDisplayName = coords.name || '서울';

            if (state.city === 'GPS' && state.customLatLon) {
                coords = state.customLatLon;
                locationDisplayName = '내 위치 (GPS)';
            }

            const badge = document.getElementById('location-badge');
            if (badge) badge.innerText = locationDisplayName;

            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,apparent_temperature,windspeed_10m&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`);
                const data = await response.json();

                if (data && data.current_weather) {
                    state.temp = Math.round(data.current_weather.temperature);
                    state.windSpeed = data.current_weather.windspeed || 2.5;
                    
                    if (data.hourly) {
                        const currentHour = new Date().getHours();
                        state.humidity = data.hourly.relativehumidity_2m ? data.hourly.relativehumidity_2m[currentHour] : 55;
                        state.feelsLike = data.hourly.apparent_temperature ? Math.round(data.hourly.apparent_temperature[currentHour]) : state.temp - 1;

                        if (data.hourly.temperature_2m) {
                            state.hourlyTemps = [
                                Math.round(data.hourly.temperature_2m[currentHour] || state.temp),
                                Math.round(data.hourly.temperature_2m[(currentHour + 3) % 24] || state.temp + 1),
                                Math.round(data.hourly.temperature_2m[(currentHour + 6) % 24] || state.temp + 2),
                                Math.round(data.hourly.temperature_2m[(currentHour + 9) % 24] || state.temp - 1)
                            ];
                        }
                    }

                    if (data.daily && data.daily.time) {
                        const daysKorean = ['일', '월', '화', '수', '목', '금', '토'];
                        state.weeklyData = data.daily.time.slice(0, 5).map((t, idx) => {
                            const dateObj = new Date(t);
                            const dayName = daysKorean[dateObj.getDay()];
                            const code = data.daily.weathercode ? data.daily.weathercode[idx] : 0;
                            let icon = 'sun';
                            if (code > 0 && code <= 3) icon = 'cloud';
                            else if (code > 3) icon = 'rain';
                            return {
                                day: dayName,
                                tempMin: Math.round(data.daily.temperature_2m_min[idx]),
                                tempMax: Math.round(data.daily.temperature_2m_max[idx]),
                                icon: icon
                            };
                        });
                    }

                    updateUI();
                }
            } catch (error) {
                console.error("실시간 날씨 정보 연동 오류", error);
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        function renderHourlyGraph(temps) {
            const svg = document.getElementById('hourly-svg');
            const minTemp = Math.min(...temps) - 2;
            const maxTemp = Math.max(...temps) + 2;
            const width = 300;
            const height = 90;
            const points = [];

            temps.forEach((t, index) => {
                const x = 30 + (index * (width - 60) / 3);
                const y = height - ((t - minTemp) / (maxTemp - minTemp || 1) * (height - 30) + 15);
                points.push({ x, y, temp: t });
            });

            let pathD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1];
                const curr = points[i];
                const cpX1 = prev.x + (curr.x - prev.x) / 2;
                const cpY1 = prev.y;
                const cpX2 = prev.x + (curr.x - prev.x) / 2;
                const cpY2 = curr.y;
                pathD += ` C ${cpX1} ${cpY1}, ${cpX2} ${cpY2}, ${curr.x} ${curr.y}`;
            }

            let svgContent = `
                <path d="${pathD}" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
            `;

            points.forEach((p) => {
                svgContent += `
                    <circle cx="${p.x}" cy="${p.y}" r="6" fill="#facc15" stroke="#1e293b" stroke-width="2.5"/>
                    <text x="${p.x}" y="${p.y - 10}" text-anchor="middle" font-family="Dongle" font-size="20" font-weight="bold" fill="#1e293b">${p.temp}°</text>
                `;
            });

            svg.innerHTML = svgContent;
        }

        function renderWeeklyForecast() {
            const container = document.getElementById('weekly-forecast-container');
            if (!container) return;

            let html = '';
            state.weeklyData.forEach(item => {
                let iconSvg = '';
                if (item.icon === 'sun') {
                    iconSvg = `<svg class="w-6 h-6 mx-auto" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#facc15" stroke="#1e293b" stroke-width="8"/></svg>`;
                } else if (item.icon === 'cloud') {
                    iconSvg = `<svg class="w-6 h-6 mx-auto" viewBox="0 0 100 100"><path d="M 20 60 Q 10 40 30 40 Q 40 25 60 40 Q 75 35 80 55 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="6"/></svg>`;
                } else {
                    iconSvg = `<svg class="w-6 h-6 mx-auto" viewBox="0 0 100 100"><path d="M 20 50 Q 10 30 30 30 Q 40 15 60 30 Q 75 25 80 45 Z" fill="#60a5fa" stroke="#1e293b" stroke-width="6"/><line x1="35" y1="65" x2="30" y2="80" stroke="#3b82f6" stroke-width="6"/><line x1="60" y1="65" x2="55" y2="80" stroke="#3b82f6" stroke-width="6"/></svg>`;
                }

                html += `
                    <div class="bg-amber-50 p-1 rounded-xl border border-amber-200 flex flex-col items-center">
                        <span class="font-bold text-slate-700 text-lg leading-none">${item.day}</span>
                        <div class="my-0.5">${iconSvg}</div>
                        <span class="font-bold text-slate-800 text-lg leading-none">${item.tempMin}°/${item.tempMax}°</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateUI() {
            document.getElementById('temp-display').innerText = state.temp;
            
            const comment = document.getElementById('weather-comment');
            if (state.temp < 18) comment.innerText = "어제보다 추워요!";
            else if (state.temp <= 26) comment.innerText = "날씨가 딱 좋아요!";
            else comment.innerText = "오늘은 꽤 더워요!";

            document.getElementById('humidity-val').innerText = `${state.humidity}%`;
            document.getElementById('wind-val').innerText = `${state.windSpeed}m/s`;
            document.getElementById('feels-val').innerText = `${state.feelsLike}°C`;

            renderCharacter(state.temp);
            renderRecommendations(state.temp);
            renderHourlyGraph(state.hourlyTemps);
            renderWeeklyForecast();

            lucide.createIcons();
        }

            setTodayDate();
            setupPWA();
            requestGPSLocation(true);
        };
