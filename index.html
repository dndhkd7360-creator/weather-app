<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생들의 손그림 날씨 앱</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Font (Jua for playful handwriting feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Nanum Gothic', sans-serif;
            background-color: #e0f2fe;
            user-select: none;
        }
        
        .handdrawn-border {
            border-style: solid;
            border-width: 3px;
            border-color: #1e293b;
            border-radius: 20px;
        }

        .sketch-box-blue {
            background-color: #f0fdf4;
            border: 3px solid #60a5fa;
            box-shadow: 4px 4px 0px #93c5fd;
        }

        .sketch-box-green {
            background-color: #f0fdf4;
            border: 3px solid #4ade80;
            box-shadow: 4px 4px 0px #86efac;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 3px solid #3b82f6;
            border-radius: 24px;
            padding: 12px 20px;
            box-shadow: 3px 3px 0px #93c5fd;
        }

        .speech-bubble:after {
            content: '';
            position: absolute;
            left: -15px;
            top: 40%;
            border-width: 8px 15px 8px 0;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
            display: block;
            width: 0;
        }

        .speech-bubble:before {
            content: '';
            position: absolute;
            left: -19px;
            top: 40%;
            border-width: 8px 15px 8px 0;
            border-style: solid;
            border-color: transparent #3b82f6 transparent transparent;
            display: block;
            width: 0;
        }

        .calendar-card {
            background: #ffffff;
            border: 3px solid #000;
            border-radius: 20px;
            box-shadow: 4px 4px 0px #fdba74;
        }

        .calendar-ring {
            width: 12px;
            height: 18px;
            background: #475569;
            border-radius: 6px;
            border: 2px solid #000;
        }

        /* Bounce animation for cute feeling */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .bounce-element {
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }

        /* Shiver animation for shivering character */
        @keyframes shiver {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-2px, 1px) rotate(-1deg); }
            50% { transform: translate(1px, -1px) rotate(1deg); }
            75% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
        .shiver-anim {
            animation: shiver 0.3s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 bg-sky-100">

    <!-- MAIN APP CONTAINER (Mobile Frame look) -->
    <div class="w-full max-w-md bg-sky-200/90 rounded-[35px] border-4 border-slate-800 p-4 sm:p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[780px]">
        
        <!-- Background Sky Decorative Clouds -->
        <div class="absolute top-4 left-6 text-white/70">
            <svg width="40" height="25" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </div>
        <div class="absolute top-10 right-8 text-white/70">
            <svg width="55" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </div>

        <div>
            <!-- HEADER CONTROLS (Location selector & temperature simulator) -->
            <div class="flex justify-between items-center mb-4 z-10 relative bg-white/80 p-2.5 rounded-2xl border-2 border-slate-800">
                <div class="flex items-center gap-1.5 text-slate-800 font-bold text-lg flex-1 mr-2">
                    <i data-lucide="map-pin" class="text-red-500 w-5 h-5 flex-shrink-0"></i>
                    <select id="city-select" onchange="updateWeatherByCity()" class="bg-transparent text-slate-800 focus:outline-none cursor-pointer font-bold text-base sm:text-lg w-full">
                        <option value="Seoul">서울특별시</option>
                        <option value="Busan">부산광역시</option>
                        <option value="Daegu">대구광역시</option>
                        <option value="Incheon">인천광역시</option>
                        <option value="Gwangju">광주광역시</option>
                        <option value="Daejeon">대전광역시</option>

            </div>

            <!-- TOP SECTION: CALENDAR TEMP & CHARACTER SPEECH -->
            <div class="grid grid-cols-12 gap-2 items-center my-2 relative z-10">
                
                <!-- Left: Calendar Card with Temperature -->
                <div class="col-span-6 relative">
                    <!-- Calendar Binder Rings -->
                    <div class="absolute -top-3 left-0 right-0 flex justify-around px-4 z-20">
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                        <div class="calendar-ring"></div>
                    </div>

                    <div class="calendar-card pt-4 pb-3 px-3 text-center border-3 border-slate-800">
                        <div class="bg-pink-100 rounded-xl py-1 px-2 border-2 border-pink-300 mb-2">
                            <span id="current-date" class="text-pink-600 font-bold text-base sm:text-lg tracking-wider">2026년 10월 21일</span>
                        </div>
                        <div class="flex items-center justify-center gap-0.5">
                            <span id="temp-display" class="text-5xl font-extrabold text-slate-800 tracking-tight">25</span>
                            <span class="text-2xl font-bold text-slate-700 self-start mt-1">°C</span>
                        </div>
                    </div>
                </div>

                <!-- Right: Shivering Character & Speech Bubble -->
                <div class="col-span-6 flex flex-col items-center justify-center relative pl-2">
                    
                    <!-- Speech Bubble -->
                    <div class="speech-bubble mb-2 w-full text-center">
                        <p id="weather-comment" class="text-slate-800 font-bold text-lg leading-snug">
                            어제보다 추워요.
                        </p>
                    </div>

                    <!-- SVG Handdrawn Character -->
                    <div id="character-svg" class="w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center transition-transform">
                        <!-- Dynamic SVG character rendered by JS -->
                    </div>

            <!-- MIDDLE SECTION: HOURLY WEATHER GRAPH -->
            <div class="mt-4 mb-3 sketch-box-blue p-3.5 rounded-2xl relative z-10">
                <!-- Section Title Banner -->
                <div class="inline-block bg-amber-300 border-2 border-slate-800 px-4 py-1 rounded-full text-slate-900 font-extrabold text-base mb-2 transform -rotate-1 shadow-sm">
                    시간별 날씨
                </div>

                <!-- Canvas / SVG Graph for Hourly Forecast -->
                <div class="relative w-full h-32 mt-1">
                    <!-- SVG Temperature Line & Icons -->
                    <svg id="hourly-svg" class="w-full h-full overflow-visible" viewBox="0 0 300 110">
                        <!-- Rendered via JavaScript -->
                    </svg>
                </div>

                <!-- Time Labels -->
                <div class="grid grid-cols-4 gap-1 text-center mt-1">
                    <div><span class="bg-blue-500 text-white text-xs px-2.5 py-1 rounded-full border border-blue-700 font-bold shadow-sm">9시</span></div>
                    <div><span class="bg-blue-500 text-white text-xs px-2.5 py-1 rounded-full border border-blue-700 font-bold shadow-sm">12시</span></div>

            <div class="grid grid-cols-2 gap-3 mt-3 relative z-10">
                
                <!-- Clothing Recommendation Card -->
                <div class="sketch-box-green p-3 flex items-center gap-2 rounded-2xl border-3">

                </div>

                    <div id="activity-icon" class="w-14 h-14 flex-shrink-0 flex items-center justify-center">

                    </div>
                    <div class="flex-1">
                        <p id="activity-text" class="text-slate-800 font-extrabold text-base sm:text-lg leading-tight">

        <!-- BOTTOM DECORATIVE GRASS -->
        <div class="w-full mt-4 flex justify-between items-end relative z-0">
            <svg class="w-full h-8 text-green-400" viewBox="0 0 100 20" preserveAspectRatio="none">
                <path d="M0 20 Q 5 5 10 20 Q 15 8 20 20 Q 25 3 30 20 Q 35 7 40 20 Q 45 4 50 20 Q 55 8 60 20 Q 65 2 70 20 Q 75 6 80 20 Q 85 4 90 20 Q 95 9 100 20 Z" fill="currentColor" stroke="#1e293b" stroke-width="1"/>
            </svg>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // State management
        const state = {
            city: 'Seoul',
            temp: 25,
            weatherCondition: 'Clear',
            dateStr: '',
            hourlyTemps: [22, 25, 27, 24],
            hourlyIcons: ['sun-cloud', 'sun', 'sun', 'sun-cloud'],
            isRealtime: true
        };

        // Initialize Lucide icons
        lucide.createIcons();

        // Format Date to "20XX년 X월 X일" format
        function setTodayDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            document.getElementById('current-date').innerText = `${year}년 ${month}월 ${date}일`;
        }

        // Fetch Realtime Weather from Open-Meteo API (Free & No API key required)
        async function fetchRealtimeWeather() {
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            const cityCoordinates = {
                'Seoul': { lat: 37.5665, lon: 126.9780 },
                'Busan': { lat: 35.1796, lon: 129.0756 },
                'Daegu': { lat: 35.8714, lon: 128.6014 },
                'Incheon': { lat: 37.4563, lon: 126.7052 },
                'Gwangju': { lat: 35.1595, lon: 126.8526 },
                'Daejeon': { lat: 36.3510, lon: 127.3850 },
                'Ulsan': { lat: 35.5383, lon: 129.3114 },
                'Jeju': { lat: 33.4996, lon: 126.5312 }
            };

            const coords = cityCoordinates[state.city] || cityCoordinates['Seoul'];

            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current_weather=true&hourly=temperature_2m,weathercode&timezone=Asia%2FTokyo`);
                const data = await response.json();

                if (data && data.current_weather) {
                    state.temp = Math.round(data.current_weather.temperature);
                    
                    // Extract hourly temps (next 4 intervals)
                    if (data.hourly && data.hourly.temperature_2m) {
                        const currentHour = new Date().getHours();
                        state.hourlyTemps = [
                            Math.round(data.hourly.temperature_2m[currentHour] || state.temp),
                            Math.round(data.hourly.temperature_2m[(currentHour + 3) % 24] || state.temp + 1),
                            Math.round(data.hourly.temperature_2m[(currentHour + 6) % 24] || state.temp + 2),
                            Math.round(data.hourly.temperature_2m[(currentHour + 9) % 24] || state.temp - 1)
                        ];
                    }
                    updateUI();
                }
            } catch (error) {
                console.error("실시간 날씨 정보를 가져오는데 실패했습니다.", error);
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        // Render Character SVG based on temperature
        function renderCharacter(temp) {
            const container = document.getElementById('character-svg');
            
            if (temp < 18) {
                // Cold/Shivering Girl (Matching the drawn picture)
                container.innerHTML = `
                <svg class="w-full h-full shiver-anim" viewBox="0 0 100 100">
                    <!-- Long Brown Hair -->
                    <path d="M 30 40 Q 20 60 25 80 Q 50 85 75 80 Q 80 60 70 40 Z" fill="#7c2d12" stroke="#000" stroke-width="2"/>
                    <!-- Head -->
                    <circle cx="50" cy="35" r="18" fill="#fde047" stroke="#000" stroke-width="2"/>
                    <!-- Hair Front -->
                    <path d="M 32 30 Q 50 20 68 30 Q 60 20 40 22 Z" fill="#7c2d12" stroke="#000" stroke-width="1.5"/>
                    <!-- Cold Trembling Face Expression -->
                    <path d="M 40 33 L 46 36 L 40 39" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/> <!-- > eye -->
                    <path d="M 60 33 L 54 36 L 60 39" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/> <!-- < eye -->
                    <path d="M 44 44 Q 50 41 56 44" fill="none" stroke="#000" stroke-width="2"/> <!-- mouth -->
                    <circle cx="36" cy="38" r="3" fill="#f43f5e" opacity="0.6"/> <!-- Blush -->
                    <circle cx="64" cy="38" r="3" fill="#f43f5e" opacity="0.6"/>
                    <!-- Shivering lines -->
                    <path d="M 22 45 L 18 47 M 22 55 L 17 55 M 78 45 L 82 47 M 78 55 L 83 55" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
                    <!-- Brown Coat & Crossed Arms -->
                    <path d="M 32 52 L 28 85 L 72 85 L 68 52 Z" fill="#d97706" stroke="#000" stroke-width="2"/>
                    <!-- Folded Arms -->
                    <path d="M 32 55 Q 50 70 68 55 Q 50 65 32 55 Z" fill="#b45309" stroke="#000" stroke-width="2"/>
                    <!-- Legs/Boots -->
                    <rect x="38" y="85" width="8" height="12" fill="#1e293b" rx="2" stroke="#000" stroke-width="1.5"/>
                    <rect x="54" y="85" width="8" height="12" fill="#1e293b" rx="2" stroke="#000" stroke-width="1.5"/>
                </svg>`;
            } else if (temp <= 27) {
                // Mild / Comfortable Character
                container.innerHTML = `
                <svg class="w-full h-full bounce-element" viewBox="0 0 100 100">
                    <!-- Hair -->
                    <path d="M 30 35 Q 20 60 28 75 Q 50 80 72 75 Q 80 60 70 35 Z" fill="#7c2d12" stroke="#000" stroke-width="2"/>
                    <!-- Face -->
                    <circle cx="50" cy="35" r="18" fill="#fde047" stroke="#000" stroke-width="2"/>
                    <!-- Eyes & Smile -->
                    <circle cx="43" cy="34" r="2.5" fill="#000"/>
                    <circle cx="57" cy="34" r="2.5" fill="#000"/>
                    <path d="M 44 42 Q 50 48 56 42" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="38" cy="38" r="3" fill="#f43f5e" opacity="0.5"/>
                    <circle cx="62" cy="38" r="3" fill="#f43f5e" opacity="0.5"/>
                    <!-- Pink Sweater -->
                    <path d="M 32 52 L 28 80 L 72 80 L 68 52 Z" fill="#f472b6" stroke="#000" stroke-width="2"/>
                    <!-- Hands -->
                    <path d="M 30 55 Q 20 65 25 72" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 70 55 Q 80 65 75 72" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
                    <!-- Pants -->
                    <rect x="38" y="80" width="9" height="15" fill="#2563eb" stroke="#000" stroke-width="1.5"/>
                    <rect x="53" y="80" width="9" height="15" fill="#2563eb" stroke="#000" stroke-width="1.5"/>
                </svg>`;
            } else {
                // Hot / Sweat Character
                container.innerHTML = `
                <svg class="w-full h-full bounce-element" viewBox="0 0 100 100">
                    <circle cx="50" cy="38" r="19" fill="#fde047" stroke="#000" stroke-width="2"/>
                    <path d="M 38 33 Q 43 30 46 35" fill="none" stroke="#000" stroke-width="2"/>
                    <path d="M 62 33 Q 57 30 54 35" fill="none" stroke="#000" stroke-width="2"/>
                    <ellipse cx="50" cy="45" rx="5" ry="6" fill="#000"/> <!-- Open mouth -->
                    <!-- Sweat Drop -->
                    <path d="M 68 28 Q 72 32 68 36 Q 64 32 68 28 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
                    <!-- Short Sleeves -->
                    <path d="M 32 54 L 28 80 L 72 80 L 68 54 Z" fill="#38bdf8" stroke="#000" stroke-width="2"/>
                    <!-- Fan or waving hand -->
                    <circle cx="38" cy="85" r="4" fill="#000"/>
                    <circle cx="62" cy="85" r="4" fill="#000"/>
                </svg>`;
            }
        }

        // Render Clothing Icon & Text
        function renderClothingCard(temp) {
            const iconBox = document.getElementById('clothes-icon');
            const textBox = document.getElementById('clothes-text');

            if (temp < 18) {
                textBox.innerText = "두꺼운 코트나 패딩이 필요해요!";
                iconBox.innerHTML = `
                <svg viewBox="0 0 60 60" class="w-12 h-12">
                    <!-- Coat -->
                    <path d="M 15 15 L 25 10 L 35 10 L 45 15 L 50 35 L 42 37 L 42 52 L 18 52 L 18 37 L 10 35 Z" fill="#ea580c" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M 30 10 L 30 52" stroke="#000" stroke-width="2"/>
                </svg>`;
            } else if (temp <= 26) {
                textBox.innerText = "도톰한 옷이 좋아요.";
                iconBox.innerHTML = `
                <svg viewBox="0 0 60 60" class="w-12 h-12">
                    <!-- Pink Sweater from student picture -->
                    <path d="M 12 20 L 22 12 L 38 12 L 48 20 L 52 38 L 44 40 L 44 52 L 16 52 L 16 40 L 8 38 Z" fill="#f472b6" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
                    <!-- Collar -->
                    <path d="M 22 12 Q 30 18 38 12" fill="none" stroke="#000" stroke-width="2"/>
                    <path d="M 10 18 L 15 22 M 50 18 L 45 22" stroke="#f472b6" stroke-width="2"/>
                </svg>`;
            } else {
                textBox.innerText = "시원한 반팔과 반바지!";
                iconBox.innerHTML = `
                <svg viewBox="0 0 60 60" class="w-12 h-12">
                    <!-- T-shirt -->
                    <path d="M 15 18 L 24 12 L 36 12 L 45 18 L 50 28 L 42 32 L 42 48 L 18 48 L 18 32 L 10 28 Z" fill="#38bdf8" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
                </svg>`;
            }
        }

        // Render Activity Icon & Text
        function renderActivityCard(temp) {
            const iconBox = document.getElementById('activity-icon');
            const textBox = document.getElementById('activity-text');

            if (temp < 15) {
                textBox.innerText = "따뜻한 실내 운동 추천!";
                iconBox.innerHTML = `
                <svg viewBox="0 0 60 60" class="w-12 h-12">
                    <!-- Indoor Stretching -->
                    <circle cx="30" cy="18" r="7" fill="#fde047" stroke="#000" stroke-width="2"/>
                    <path d="M 30 25 L 30 42 M 20 30 L 40 30 M 22 52 L 30 42 L 38 52" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>`;
            } else if (temp <= 28) {
                textBox.innerText = "가볍게 달리거나 산책하기 좋아요.";
                iconBox.innerHTML = `
                <!-- Running Boy matching original drawing -->
                <svg viewBox="0 0 60 60" class="w-12 h-12">
                    <circle cx="35" cy="16" r="6" fill="#fde047" stroke="#000" stroke-width="2"/>
                    <!-- Green Shirt & Motion -->
                    <path d="M 28 22 L 38 24 L 34 38 L 24 36 Z" fill="#22c55e" stroke="#000" stroke-width="2"/>
                    <!-- Running Legs -->
                    <path d="M 26 37 L 18 45 L 26 52" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 32 38 L 42 44 L 48 40" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Speed lines -->
                    <path d="M 8 25 L 16 25 M 6 32 L 12 32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
                </svg>`;
            } else {
                textBox.innerText = "시원한 수영장에 가요!";
                iconBox.innerHTML = `
                <svg viewBox="0 0 60 60" class="w-12 h-12">
                    <circle cx="30" cy="22" r="7" fill="#fde047" stroke="#000" stroke-width="2"/>
                    <!-- Waves -->
                    <path d="M 10 38 Q 20 32 30 38 Q 40 44 50 38" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
                    <path d="M 10 46 Q 20 40 30 46 Q 40 52 50 46" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
                </svg>`;
            }
        }

        // Render SVG Hourly Chart with Weather Icons and Curved Line
        function renderHourlyChart(temps) {
            const svg = document.getElementById('hourly-svg');
            const xCoords = [35, 110, 185, 260];
            
            // Map temperature values to Y coordinates on canvas (min 10, max 35)
            const minT = 10, maxT = 35;
            const minY = 85, maxY = 35; // Inverted SVG Y axis

            const points = temps.map((t, idx) => {
                const clamped = Math.max(minT, Math.min(maxT, t));
                const y = minY - ((clamped - minT) / (maxT - minT)) * (minY - maxY);
                return { x: xCoords[idx], y, temp: t };
            });

            // Build smooth path
            let d = `M ${points[0].x} ${points[0].y}`;
            for (let i = 0; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) / 2;
                const yc = (points[i].y + points[i + 1].y) / 2;
                d += ` Q ${points[i].x} ${points[i].y}, ${xc} ${yc}`;
            }
            d += ` L ${points[points.length - 1].x} ${points[points.length - 1].y}`;

            // Generate Icons on top of graph
            let iconsHTML = '';
            points.forEach((p, i) => {
                const iconType = state.hourlyIcons[i];
                let iconSvg = '';

                if (iconType === 'sun') {
                    // Sun icon from student drawing
                    iconSvg = `
                    <g transform="translate(${p.x - 14}, ${p.y - 32}) font-scale(0.8)">
                        <circle cx="14" cy="14" r="7" fill="#f97316" stroke="#000" stroke-width="1.5"/>
                        <!-- Sun Rays -->
                        <path d="M 14 2 L 14 5 M 14 23 L 14 26 M 2 14 L 5 14 M 23 14 L 26 14 M 5 5 L 7 7 M 21 21 L 23 23 M 5 23 L 7 21 M 21 5 L 23 7" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
                    </g>`;
                } else {
                    // Sun behind Cloud from student drawing
                    iconSvg = `
                    <g transform="translate(${p.x - 16}, ${p.y - 32})">
                        <!-- Sun in back -->
                        <circle cx="20" cy="10" r="6" fill="#f97316" stroke="#000" stroke-width="1"/>
                        <!-- Cloud in front -->
                        <path d="M 8 18 Q 8 12 14 12 Q 17 8 22 11 Q 26 10 27 15 Q 31 16 30 20 Z" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
                    </g>`;
                }

                // Point dot on line
                iconsHTML += `
                ${iconSvg}
                <!-- Line Node Circle -->
                <circle cx="${p.x}" cy="${p.y}" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
                <!-- Temp label under dot -->
                <text x="${p.x}" y="${p.y + 15}" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">${p.temp}°</text>
                <!-- Vertical grid dotted line -->
                <line x1="${p.x}" y1="10" x2="${p.x}" y2="90" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 3"/>
                `;
            });

            svg.innerHTML = `
                <!-- Background grid lines -->
                <path d="${d}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                ${iconsHTML}
            `;
        }

        // Main Refresh Function
        function updateUI() {
            document.getElementById('temp-display').innerText = state.temp;
            
            // Speech comment based on temp
            const commentBox = document.getElementById('weather-comment');
            if (state.temp < 10) {
                commentBox.innerText = "너무 추워요! 옷 단단히 입으세요.";
            } else if (state.temp < 18) {
                commentBox.innerText = "어제보다 추워요.";
            } else if (state.temp <= 27) {
                commentBox.innerText = "날씨가 참 선선해요!";
            } else {
                commentBox.innerText = "어제보다 더워요!";
            }

            renderCharacter(state.temp);
            renderClothingCard(state.temp);
            renderActivityCard(state.temp);

            renderHourlyChart(state.hourlyTemps);
        }

        // City Selector Handler
        function updateWeatherByCity() {
            const select = document.getElementById('city-select');
            state.city = select.value;
            fetchRealtimeWeather();
        }

        // Initialize on Load
        window.onload = function() {
            setTodayDate();
            fetchRealtimeWeather();
        };
    </script>
</body>
</html>
